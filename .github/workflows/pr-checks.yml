name: PR checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compile and verify
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Check pricing foundation
        run: java -cp target/classes:target/test-classes br.uneb.montecarlo.FoundationCheck

      - name: Check coordinator lifecycle
        run: java -cp target/classes:target/test-classes br.uneb.montecarlo.CoordinatorCheck

      - name: Check benchmark command
        run: java -cp target/classes br.uneb.montecarlo.BenchmarkMain 8193 4 1 42
